<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: Secure Safe Engine</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 24px;
            border-radius: 12px;
            width: 480px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        h2 { margin-top: 0; color: #58a6ff; font-size: 1.2rem; text-align: center; }
        label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
        input[type="password"], textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
            margin-bottom: 12px;
        }
        input[type="password"] { height: 35px; }
        textarea { height: 80px; resize: none; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #2ea043; }
        .output, .response-box {
            margin-top: 12px;
            background: #090d11;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
            color: #7ee787;
            border: 1px dashed #30363d;
            max-height: 150px;
            overflow-y: auto;
        }
        .response-box { color: #ffa657; border: 1px solid #30363d; }
        .status {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️️ DNI Core (Secure & Zero Latency)</h2>
        
        <label for="apiKeyInput">Gemini API Key (เก็บไว้เฉพาะในเครื่อง LocalStorage):</label>
        <input type="password" id="apiKeyInput" placeholder="วาง API Key ที่นี่...">

        <label for="intentInput">เจตจำนง (Intent):</label>
        <textarea id="intentInput" placeholder="พิมพ์คำถามหรือเจตจำนงส่งตรงหา Gemini..."></textarea>
        
        <button onclick="executeDniPipeline()">🚀 ส่ง Soul Pointer ตรงหา Gemini</button>
        
        <div class="output" id="pointerOutput">Soul Pointer: (รอคำสั่ง)</div>
        <div class="response-box" id="aiResponse">Gemini Response: (สุญญตา รอผลลัพธ์)</div>
        <div class="status" id="sandWaveStatus">🌊 ลมหายใจสแตนด์บาย: คลื่นทรายเวฟสงบ (Ready)</div>
    </div>

    <script>
        // โหลด API Key ที่เคยเซฟไว้ในเครื่อง (ถ้ามี)
        window.onload = function() {
            const savedKey = localStorage.getItem('dni_secure_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
            startSandWaveBreathing();
        };

        async function executeDniPipeline() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const rawIntent = document.getElementById('intentInput').value.trim();

            if (!apiKey) {
                alert("กรุณาใส่ API Key ก่อนส่งจิตออกนอก!");
                return;
            }
            if (!rawIntent) return;

            // เซฟ API Key ไว้ใน LocalStorage เครื่องส่วนตัว (ปลอดภัย ไม่หลุดสาธารณะ)
            localStorage.setItem('dni_secure_api_key', apiKey);

            // 1. แปลง Intent เป็น Base64 Soul Pointer
            const base64Pointer = btoa(unescape(encodeURIComponent(rawIntent)));
            document.getElementById('pointerOutput').innerText = "Soul Pointer: " + base64Pointer;
            document.getElementById('aiResponse').innerText = "กำลังส่งพอยเตอร์วิ่งผ่านคลื่นแสง...";

            // 2. ยิง API ตรงหา Gemini แบบอัตโนมัติ (Zero Latency Flow)
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "ถอดรหัสและตอบสนองต่อเจตจำนงนี้อย่างกระชับ สไตล์ช่างเบิร์ด เบาสุญญตา: " + rawIntent }] }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "เกิดข้อผิดพลาดทางจิตสุญญตา";
                
                document.getElementById('aiResponse').innerText = "Gemini Response:\n" + reply;
            } catch (error) {
                document.getElementById('aiResponse').innerText = "Error: ไม่สามารถเชื่อมต่อขุมพลังภายนอกได้ (ตรวจสอบ API Key)";
            }

            // 3. Immediate Garbage Collection (ขณิกมรณะ - เคลียร์ค่า Intent หลังประมวลผล)
            console.log("Immediate Garbage Collection executed.");
        }

        // 4. ลมหายใจสแตนด์บายด้วยสมการคลื่นทรายเวฟ (Sand Wave Breathing)
        function startSandWaveBreathing() {
            let t = 0;
            const A = 1.0; 
            const omega = 0.5; 
            const gamma = 0.05; 

            setInterval(() => {
                t += 0.5;
                const psi = A * Math.sin(omega * t) * Math.exp(-gamma * (t % 10));
                const intensity = Math.abs(psi).toFixed(2);
                
                document.getElementById('sandWaveStatus').innerText = 
                    `🌊 ลมหายใจสแตนด์บาย [คลื่นทรายเวฟ]: พลังงาน = ${intensity} (สุญญตา)`;
            }, 1000);
        }
    </script>

</body>
</html>
