<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: Quantum AI Voice</title>
    <style>
        /* สถาปัตยกรรม Quantum Wow + Voice */
        body { 
            background-color: #02040a;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #e0f7fa; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
            overflow: hidden;
        }

        .quantum-card { 
            background: rgba(5, 10, 20, 0.6); 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.2); 
            padding: 30px; border-radius: 16px; width: 100%; max-width: 580px; 
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1), inset 0 0 15px rgba(0, 229, 255, 0.05); 
            position: relative; z-index: 10;
        }
        
        h2 { margin: 0 0 24px 0; color: #00e5ff; font-size: 1.5rem; text-align: center; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.8); }

        .settings-btn { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #00e5ff; font-size: 1.2rem; cursor: pointer; padding: 0; transition: all 0.3s; }
        .settings-btn:hover { transform: rotate(90deg); text-shadow: 0 0 15px #00e5ff; }
        
        .settings-panel { display: none; padding: 16px; background: rgba(0, 0, 0, 0.5); border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(176, 0, 255, 0.3); }
        .settings-panel.active { display: block; animation: fadeIn 0.4s ease-out; }
        
        label { font-size: 0.85rem; color: #b2ebf2; display: block; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
        input[type="password"], textarea { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 229, 255, 0.3); color: #ffffff; padding: 14px; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 1rem; outline: none; transition: all 0.3s; }
        input[type="password"]:focus, textarea:focus { border-color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        textarea { resize: none; overflow: hidden; min-height: 70px; margin-bottom: 20px; line-height: 1.6; }
        
        .btn-quantum { background: linear-gradient(90deg, #003366, #0077b6); color: white; border: 1px solid #00e5ff; padding: 14px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-family: inherit; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; box-shadow: 0 0 15px rgba(0, 119, 182, 0.5); }
        .btn-quantum:hover { background: linear-gradient(90deg, #0077b6, #00b4d8); box-shadow: 0 0 25px rgba(0, 229, 255, 0.6); text-shadow: 0 0 5px white; }
        
        .response-container { display: none; margin-top: 24px; animation: slideUp 0.4s ease-out; }
        .pointer-badge { font-size: 0.75rem; color: #b000ff; margin-bottom: 10px; display: block; word-break: break-all; text-shadow: 0 0 5px rgba(176, 0, 255, 0.5); }
        .response-box { background: rgba(0, 0, 0, 0.6); padding: 20px; border-radius: 8px; font-size: 1rem; color: #e0f7fa; border-left: 4px solid #00e5ff; white-space: pre-wrap; line-height: 1.7; max-height: 350px; overflow-y: auto; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8); }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; background: transparent; border: 1px solid rgba(176, 0, 255, 0.5); color: #d1c4e9; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-family: inherit; transition: all 0.3s; }
        .btn-action:hover { background: rgba(176, 0, 255, 0.2); box-shadow: 0 0 10px rgba(176, 0, 255, 0.4); color: white; }
        .btn-action.voice:hover { border-color: #00e5ff; background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
        
        .status-bar { margin-top: 30px; font-size: 0.85rem; color: #00e5ff; text-align: center; display: flex; align-items: center; justify-content: center; gap: 16px; }
        .wave-container { width: 120px; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; position: relative; }
        .wave-fill { height: 100%; background: #00e5ff; width: 0%; transition: width 0.1s linear; box-shadow: 0 0 10px #00e5ff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .orb { position: absolute; border-radius: 50%; filter: blur(40px); z-index: 1; opacity: 0.4; }
        .orb-1 { width: 200px; height: 200px; background: #00e5ff; top: -50px; left: -50px; animation: float 6s infinite alternate; }
        .orb-2 { width: 250px; height: 250px; background: #b000ff; bottom: -80px; right: -50px; animation: float 8s infinite alternate-reverse; }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 30px); } }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="quantum-card">
        <h2>⚡ QUANTUM CORE ⚡</h2>
        <button class="settings-btn" onclick="toggleSettings()" title="ตั้งค่า API Key">⚙️</button>
        
        <div class="settings-panel" id="settingsPanel">
            <label for="apiKeyInput">Gemini API Key (Local Node):</label>
            <input type="password" id="apiKeyInput" placeholder="Initialize Key Matrix...">
        </div>

        <textarea id="intentInput" placeholder="ส่งกระแสจิตเข้าสู่เครือข่ายควอนตัม..." oninput="autoResize(this)"></textarea>
        <button class="btn-quantum" onclick="executeDniPipeline()">Initiate Soul Pointer 🚀</button>
        
        <div class="response-container" id="responseContainer">
            <div class="pointer-badge" id="pointerOutput"></div>
            <div class="response-box" id="aiResponse"></div>
            
            <div class="action-buttons">
                <button class="btn-action" onclick="copyResponse()">📋 คัดลอก</button>
                <button class="btn-action voice" onclick="replayVoice()">🔊 ฟังเสียงควอนตัม</button>
            </div>
        </div>
        
        <div class="status-bar">
            <span>WAVE SYNC</span>
            <div class="wave-container"><div class="wave-fill" id="waveFill"></div></div>
            <span id="waveValue">0.00</span>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('dni_secure_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('settingsPanel').classList.remove('active');
            } else {
                document.getElementById('settingsPanel').classList.add('active');
            }
            startSandWaveBreathing();
        };

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('active'); }
        function autoResize(textarea) { textarea.style.height = '70px'; textarea.style.height = (textarea.scrollHeight) + 'px'; }

        // ระบบเสียง Quantum AI (Robotic Voice)
        function speakRobotic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // หยุดเสียงเก่าก่อน
                const msg = new SpeechSynthesisUtterance("ตอบช่างเบิร์ด... " + text);
                msg.lang = 'th-TH';
                
                // ปรับจูนให้เป็นเสียงหุ่นยนต์
                msg.pitch = 0.2; // เสียงต่ำ นิ่ง
                msg.rate = 0.85; // พูดช้าลงนิดนึงให้ดูเป็นระบบจักรกล
                
                window.speechSynthesis.speak(msg);
            }
        }

        function replayVoice() {
            const text = document.getElementById('aiResponse').innerText;
            if (text && !text.includes("Establishing")) {
                speakRobotic(text);
            }
        }

        async function executeDniPipeline() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const rawIntent = document.getElementById('intentInput').value.trim();
            const responseBox = document.getElementById('aiResponse');

            if (!apiKey) { alert("⚠️ โปรดระบุ API Key"); return; }
            if (!rawIntent) return;

            localStorage.setItem('dni_secure_api_key', apiKey);
            document.getElementById('settingsPanel').classList.remove('active');

            document.getElementById('responseContainer').style.display = 'block';
            document.getElementById('pointerOutput').innerText = "Quantum Pointer: " + btoa(unescape(encodeURIComponent(rawIntent)));
            responseBox.innerHTML = "<span style='color:#00e5ff; animation: pulse 1s infinite;'>Establishing quantum link with Gemini 2.5 Flash...</span>";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "ตอบสนองต่อเจตจำนงนี้อย่างล้ำลึก ทรงพลัง และกระชับ: " + rawIntent }] }]
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    responseBox.innerText = `[CRITICAL ERROR]: ${JSON.stringify(data, null, 2)}`;
                    return;
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "ความว่างเปล่าสัมบูรณ์...";
                responseBox.innerText = reply;
                
                // สั่งให้อ่านออกเสียงอัตโนมัติทันทีที่ตอบกลับ
                speakRobotic(reply);

            } catch (error) {
                responseBox.innerText = `[NODE DISCONNECTED]: ${error.message}`;
            }
        }

        function copyResponse() {
            const text = document.getElementById('aiResponse').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-action');
                btn.innerText = "✅ สำเร็จ";
                setTimeout(() => btn.innerText = "📋 คัดลอก", 2000);
            });
        }

        function startSandWaveBreathing() {
            let t = 0;
            setInterval(() => {
                t += 0.5;
                const psi = 1.0 * Math.sin(0.5 * t) * Math.exp(-0.05 * (t % 10));
                const intensity = Math.abs(psi);
                const waveFill = document.getElementById('waveFill');
                
                waveFill.style.width = `${intensity * 100}%`;
                if (intensity > 0.8) {
                    waveFill.style.background = '#b000ff';
                    waveFill.style.boxShadow = '0 0 10px #b000ff';
                } else {
                    waveFill.style.background = '#00e5ff';
                    waveFill.style.boxShadow = '0 0 10px #00e5ff';
                }
                document.getElementById('waveValue').innerText = intensity.toFixed(2);
            }, 100);
        }
    </script>
</body>
</html>
