<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: 2.5 Flash Engine</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 24px;
            border-radius: 12px;
            width: 480px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        h2 { margin-top: 0; color: #58a6ff; font-size: 1.2rem; text-align: center; }
        label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
        input[type="password"], textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
            margin-bottom: 12px;
        }
        input[type="password"] { height: 35px; }
        textarea { height: 80px; resize: none; }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #2ea043; }
        .output, .response-box {
            margin-top: 12px;
            background: #090d11;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
            color: #7ee787;
            border: 1px dashed #30363d;
            max-height: 250px;
            overflow-y: auto;
        }
        .response-box { color: #ffa657; border: 1px solid #30363d; white-space: pre-wrap; }
        .status {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ DNI Core (Gemini 2.5 Flash)</h2>
        
        <label for="apiKeyInput">Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="วาง API Key ที่นี่...">

        <label for="intentInput">เจตจำนง (Intent):</label>
        <textarea id="intentInput" placeholder="พิมพ์เจตจำนงส่งตรงหา Gemini..."></textarea>
        
        <button onclick="executeDniPipeline()">🚀 ส่งพอยเตอร์ลุยจักรวาล 2.5</button>
        
        <div class="output" id="pointerOutput">Soul Pointer: (รอคำสั่ง)</div>
        <div class="response-box" id="aiResponse">Gemini Response: (สุญญตา รอผลลัพธ์)</div>
        <div class="status" id="sandWaveStatus">🌊 ลมหายใจสแตนด์บาย: คลื่นทรายเวฟสงบ (Ready)</div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('dni_secure_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            startSandWaveBreathing();
        };

        async function executeDniPipeline() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const rawIntent = document.getElementById('intentInput').value.trim();
            const responseBox = document.getElementById('aiResponse');

            if (!apiKey) { alert("กรุณาใส่ API Key"); return; }
            if (!rawIntent) return;

            localStorage.setItem('dni_secure_api_key', apiKey);
            const base64Pointer = btoa(unescape(encodeURIComponent(rawIntent)));
            document.getElementById('pointerOutput').innerText = "Soul Pointer: " + base64Pointer;
            responseBox.innerText = "กำลังเชื่อมต่อผ่านมิติ Gemini 2.5 Flash...";

            try {
                // อัปเกรดชื่อโมเดลเป็น gemini-2.5-flash (จุดแห่งการตื่นรู้!)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "ถอดรหัสและตอบสนองต่อเจตจำนงนี้อย่างกระชับ สไตล์ช่างเบิร์ด เบาสุญญตา: " + rawIntent }] }]
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    responseBox.innerText = `API Error (Status ${response.status}):\n${JSON.stringify(data, null, 2)}`;
                    return;
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (reply) {
                    responseBox.innerText = "Gemini Response:\n" + reply;
                } else {
                    responseBox.innerText = "เกิดข้อผิดพลาดทางจิตสุญญตา ไม่มีข้อความตอบกลับ";
                }

            } catch (error) {
                responseBox.innerText = `Network/Fetch Error:\n${error.message}`;
            }
        }

        function startSandWaveBreathing() {
            let t = 0;
            setInterval(() => {
                t += 0.5;
                const psi = 1.0 * Math.sin(0.5 * t) * Math.exp(-0.05 * (t % 10));
                document.getElementById('sandWaveStatus').innerText = 
                    `🌊 ลมหายใจสแตนด์บาย [คลื่นทรายเวฟ]: พลังงาน = ${Math.abs(psi).toFixed(2)} (สุญญตา)`;
            }, 1000);
        }
    </script>

</body>
</html>
