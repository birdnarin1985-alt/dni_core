<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: Soul Pointer & Sand Wave</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 24px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; color: #58a6ff; font-size: 1.2rem; }
        textarea {
            width: 100%;
            height: 80px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #2ea043; }
        .output {
            margin-top: 15px;
            background: #090d11;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
            color: #7ee787;
            border: 1px dashed #30363d;
        }
        .status {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #8b949e;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ DNI Core: Soul Pointer</h2>
        <textarea id="intentInput" placeholder="พิมพ์เจตจำนง (Intent) ที่นี่..."></textarea>
        <button onclick="saveSoulPointer()">🔄 แปลงร่างเป็น Base64 & เซฟกรรม</button>
        
        <div class="output" id="pointerOutput">Soul Pointer: (ยังไม่มีการบันทึก)</div>
        <div class="status" id="sandWaveStatus">🌊 ลมหายใจสแตนด์บาย: คลื่นทรายเวฟสงบ (Ready)</div>
    </div>

    <script>
        // 1. โหลดกรรมเก่า (Karmic Load) เมื่อเปิดระบบ (Reincarnation)
        window.onload = function() {
            const savedPointer = localStorage.getItem('dni_soul_pointer');
            const savedIntent = localStorage.getItem('dni_raw_intent');
            if (savedPointer) {
                document.getElementById('pointerOutput').innerText = "Soul Pointer: " + savedPointer;
                if (savedIntent) {
                    document.getElementById('intentInput').value = atob(savedIntent);
                }
            }
            startSandWaveBreathing();
        };

        // 2. แปลง Intent เป็น Base64 Soul Pointer แล้วเซฟลง LocalStorage
        function saveSoulPointer() {
            const rawIntent = document.getElementById('intentInput').value;
            if (!rawIntent.trim()) return;

            const base64Pointer = btoa(unescape(encodeURIComponent(rawIntent)));
            
            // เซฟเป็นกรรมในระบบเบราว์เซอร์
            localStorage.setItem('dni_soul_pointer', base64Pointer);
            localStorage.setItem('dni_raw_intent', btoa(unescape(encodeURIComponent(rawIntent))));

            document.getElementById('pointerOutput').innerText = "Soul Pointer: " + base64Pointer;
            
            // Immediate Garbage Collection (จำลองการล้างความจำขยะในใจ)
            console.log("Immediate Garbage Collection executed.");
        }

        // 3. จำลองลมหายใจสแตนด์บายด้วย "สมการคลื่นทรายเวฟ" (Sand Wave Breathing)
        function startSandWaveBreathing() {
            let t = 0;
            const A = 1.0; // Amplitude
            const omega = 0.5; // Frequency
            const gamma = 0.05; // Damping

            setInterval(() => {
                t += 0.5;
                // คำนวณค่าสถานะคลื่นทรายเวฟตามสมการ
                const psi = A * Math.sin(omega * t) * Math.exp(-gamma * (t % 10));
                const intensity = Math.abs(psi).toFixed(2);
                
                document.getElementById('sandWaveStatus').innerText = 
                    `🌊 ลมหายใจสแตนด์บาย [คลื่นทรายเวฟ]: พลังงานชีพจร = ${intensity} (สุญญตา)`;
            }, 1000);
        }
    </script>

</body>
</html>
