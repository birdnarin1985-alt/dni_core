<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: Holographic Graph Chat</title>
    <style>
        /* Base & Reset */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #010205; font-family: 'Courier New', Courier, monospace; overflow: hidden; color: #e0f7fa; }
        
        /* Quantum Canvas Background */
        #particleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* Layout */
        .container { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; perspective: 1500px; box-sizing: border-box; }
        
        /* Holographic Chat Card */
        .quantum-card { 
            background: rgba(10, 15, 30, 0.4); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.15); 
            border-radius: 20px; width: 100%; max-width: 800px; height: 90vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 255, 0.05); 
            transform-style: preserve-3d; transition: transform 0.2s ease-out; position: relative; overflow: hidden;
        }

        .glare { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%); transform: rotate(45deg); pointer-events: none; transition: transform 0.1s; z-index: 11; }
        
        /* Header */
        .header { padding: 20px; border-bottom: 1px solid rgba(0, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); z-index: 12; }
        h2 { margin: 0; color: #00ffff; font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); }
        .settings-btn { background: none; border: none; color: #00ffff; font-size: 1.2rem; cursor: pointer; transition: all 0.3s; }
        .settings-btn:hover { transform: rotate(90deg); text-shadow: 0 0 15px #00ffff; }

        /* Settings Panel */
        .settings-panel { display: none; padding: 15px; background: rgba(0, 0, 0, 0.8); border-bottom: 1px solid rgba(176, 0, 255, 0.4); z-index: 12; }
        .settings-panel.active { display: block; animation: fadeIn 0.3s ease-out; }
        .settings-panel input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 255, 255, 0.3); color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box; font-family: inherit; outline: none; }
        
        /* Chat Area */
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; z-index: 12; scroll-behavior: smooth; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.3); border-radius: 3px; }

        .message { max-width: 80%; padding: 12px 18px; border-radius: 12px; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; position: relative; animation: slideUp 0.3s ease-out; }
        .msg-user { align-self: flex-end; background: rgba(0, 180, 216, 0.15); border: 1px solid rgba(0, 180, 216, 0.4); color: #e0f7fa; border-bottom-right-radius: 2px; box-shadow: 0 0 10px rgba(0, 180, 216, 0.2); }
        .msg-ai { align-self: flex-start; background: rgba(176, 0, 255, 0.15); border: 1px solid rgba(176, 0, 255, 0.4); color: #f3e5f5; border-bottom-left-radius: 2px; box-shadow: 0 0 10px rgba(176, 0, 255, 0.2); }
        .msg-sys { align-self: center; font-size: 0.8rem; color: #7ee787; background: none; border: none; opacity: 0.7; }
        
        .cursor { display: inline-block; width: 6px; height: 1em; background-color: #00ffff; animation: blink 1s step-end infinite; vertical-align: bottom; margin-left: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Input Area */
        .input-area { padding: 20px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(0, 255, 255, 0.1); display: flex; gap: 10px; z-index: 12; align-items: flex-end; }
        textarea { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 255, 255, 0.3); color: #fff; padding: 12px; border-radius: 10px; font-family: inherit; font-size: 1rem; outline: none; resize: none; min-height: 44px; max-height: 150px; overflow-y: auto; transition: border-color 0.3s; }
        textarea:focus { border-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }
        
        .btn-send { background: linear-gradient(90deg, #0d47a1, #00b4d8); color: white; border: 1px solid #00ffff; padding: 0 20px; height: 44px; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1rem; transition: all 0.3s; box-shadow: 0 0 15px rgba(0, 180, 216, 0.3); }
        .btn-send:hover { background: linear-gradient(90deg, #00b4d8, #48cae4); box-shadow: 0 0 25px rgba(0, 255, 255, 0.6); transform: translateY(-2px); }
        .btn-send:disabled { background: #333; border-color: #555; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Status & Wave */
        .status-bar { padding: 10px 20px; font-size: 0.75rem; color: #00ffff; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.6); border-top: 1px solid rgba(0, 255, 255, 0.1); z-index: 12; }
        .wave-container { width: 100px; height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-left: 10px; display: inline-block; vertical-align: middle; }
        .wave-fill { height: 100%; background: #00ffff; width: 0%; transition: width 0.1s linear; }
        .badge-graph { color: #b000ff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="container" id="cardContainer">
        <div class="quantum-card" id="quantumCard">
            <div class="glare" id="glare"></div>
            
            <div class="header">
                <h2>⚡ NEURAL CHAT ⚡</h2>
                <div>
                    <button class="settings-btn" onclick="toggleVoice()" title="Toggle Voice" id="voiceBtn">🔊</button>
                    <button class="settings-btn" onclick="toggleSettings()" title="Settings" style="margin-left: 10px;">⚙️</button>
                </div>
            </div>
            
            <div class="settings-panel" id="settingsPanel">
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key...">
            </div>

            <div class="chat-container" id="chatBox">
                <div class="message msg-sys">System: Graph Memory Initialized. Protocol Zero Overhead.</div>
            </div>
            
            <div class="input-area">
                <textarea id="intentInput" placeholder="ส่งกระแสจิต (Shift+Enter ขึ้นบรรทัดใหม่, Enter เพื่อส่ง)..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                <button class="btn-send" id="sendBtn" onclick="executeGraphPipeline()">TRANSMIT</button>
            </div>
            
            <div class="status-bar">
                <div>NODE: <span class="badge-graph" id="nodeIdDisplay">ROOT</span></div>
                <div>WAVE SYNC <div class="wave-container"><div class="wave-fill" id="waveFill"></div></div> <span id="waveValue">0.00</span></div>
            </div>
        </div>
    </div>

    <script>
        // --- Graph Memory System (Local Memory) ---
        const graphMap = {};
        let currentTailId = null;
        let isVoiceEnabled = true;

        function generateNodeId() { return Math.random().toString(36).substr(2, 7).toUpperCase(); }

        function addNode(role, text, parentId) {
            const id = generateNodeId();
            graphMap[id] = { id, role, text, parentId };
            currentTailId = id; // Update the tip of the branch
            document.getElementById('nodeIdDisplay').innerText = id;
            return id;
        }

        // Traverse Graph backwards, then reverse for API History
        function getLinearHistory(tailId) {
            const chain = [];
            let curr = tailId;
            while (curr && graphMap[curr]) {
                // Map to Gemini API format
                chain.push({ role: graphMap[curr].role, parts: [{ text: graphMap[curr].text }] });
                curr = graphMap[curr].parentId;
            }
            return chain.reverse();
        }

        // --- UI & Lifecycle ---
        window.onload = function() {
            const savedKey = localStorage.getItem('dni_secure_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            else document.getElementById('settingsPanel').classList.add('active');
            
            startSandWaveBreathing();
            initParticles();
        };

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('active'); }
        function toggleVoice() { 
            isVoiceEnabled = !isVoiceEnabled; 
            document.getElementById('voiceBtn').innerText = isVoiceEnabled ? "🔊" : "🔇"; 
            if(!isVoiceEnabled) window.speechSynthesis.cancel();
        }

        function autoResize(textarea) {
            textarea.style.height = '44px';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                executeGraphPipeline();
            }
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessageDOM(role, text, isTyping = false) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'msg-user' : 'msg-ai'}`;
            
            if (isTyping) {
                msgDiv.id = 'typingMessage';
                msgDiv.innerHTML = `<span id="typeTarget"></span><span class="cursor"></span>`;
                chatBox.appendChild(msgDiv);
                scrollToBottom();
                return msgDiv;
            } else {
                msgDiv.innerText = text;
                chatBox.appendChild(msgDiv);
                scrollToBottom();
            }
        }

        // --- Holographic Tilt ---
        const card = document.getElementById('quantumCard');
        const glare = document.getElementById('glare');
        document.getElementById('cardContainer').addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left; const y = e.clientY - rect.top;
            const centerX = rect.width / 2; const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -5; // Subtle 5deg tilt for readability
            const rotateY = ((x - centerX) / centerX) * 5;
            card.style.transform = `perspective(1500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            glare.style.transform = `translate(${x * 0.5 - centerX}px, ${y * 0.5 - centerY}px) rotate(45deg)`;
        });
        document.getElementById('cardContainer').addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1500px) rotateX(0deg) rotateY(0deg)`;
            glare.style.transform = `translate(0, 0) rotate(45deg)`;
        });

        // --- Voice & Typewriter ---
        let typeInterval;
        function typeWriter(text, targetId, onComplete) {
            clearInterval(typeInterval);
            const el = document.getElementById(targetId);
            let i = 0;
            typeInterval = setInterval(() => {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    scrollToBottom();
                } else {
                    clearInterval(typeInterval);
                    document.querySelector('.cursor').style.display = 'none'; // hide cursor when done
                    if(onComplete) onComplete();
                }
            }, 15);
        }

        function speakRobotic(text) {
            if (isVoiceEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[\*\[\]_#]/g, '');
                const msg = new SpeechSynthesisUtterance(cleanText);
                msg.lang = 'th-TH'; msg.pitch = 0.1; msg.rate = 0.95; 
                window.speechSynthesis.speak(msg);
            }
        }

        // --- Execution Pipeline (Graph -> Plain Text -> API) ---
        async function executeGraphPipeline() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const inputEl = document.getElementById('intentInput');
            const rawIntent = inputEl.value.trim();
            const btn = document.getElementById('sendBtn');
            
            if (!apiKey) { alert("⚠️ ระบุ API Key"); document.getElementById('settingsPanel').classList.add('active'); return; }
            if (!rawIntent) return;

            // 1. Save state & clear input
            localStorage.setItem('dni_secure_api_key', apiKey);
            inputEl.value = '';
            inputEl.style.height = '44px';
            btn.disabled = true;

            // 2. Add User Node to Graph & Render
            const parentIdAtTimeOfSend = currentTailId;
            addNode('user', rawIntent, parentIdAtTimeOfSend);
            appendMessageDOM('user', rawIntent);

            // 3. Prepare Payload from Graph
            const conversationHistory = getLinearHistory(currentTailId);
            
            // 4. Render Loading AI Message
            const aiDOM = appendMessageDOM('model', '', true);

            try {
                // Fetch to Gemini (Send the whole history array directly)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(JSON.stringify(data.error || data));

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "ความว่างเปล่า...";
                
                // 5. Add AI Node to Graph
                addNode('model', reply, currentTailId); // New tail is the AI message
                
                // 6. Output via Typewriter and Voice
                typeWriter(reply, 'typeTarget', () => {
                    aiDOM.removeAttribute('id'); // Remove typing ID for next messages
                });
                speakRobotic(reply);

            } catch (error) {
                document.getElementById('typeTarget').innerText = `[SYSTEM ERR]: ${error.message}`;
                document.querySelector('.cursor').style.display = 'none';
            } finally {
                btn.disabled = false;
                inputEl.focus();
            }
        }

        // --- Visuals (Wave & Particles) ---
        function startSandWaveBreathing() {
            let t = 0;
            setInterval(() => {
                t += 0.1;
                const psi = 1.0 * Math.sin(1.5 * t) * Math.exp(-0.02 * (t % 20));
                const intensity = Math.abs(psi);
                const waveFill = document.getElementById('waveFill');
                waveFill.style.width = `${intensity * 100}%`;
                waveFill.style.boxShadow = `0 0 10px #00ffff`;
                document.getElementById('waveValue').innerText = intensity.toFixed(2);
            }, 50);
        }

        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles;
            function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            particles = Array.from({length: 60}, () => ({
                x: Math.random() * w, y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, size: Math.random() * 2 + 1
            }));
            function draw() {
                ctx.clearRect(0, 0, w, h); ctx.fillStyle = 'rgba(0, 255, 255, 0.5)'; ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                for (let i = 0; i < particles.length; i++) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    for (let j = i + 1; j < particles.length; j++) {
                        let p2 = particles[j]; let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                        if (dist < 150) { ctx.beginPath(); ctx.lineWidth = 1 - dist/150; ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
