<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: Sunyata UI/UX</title>
    <style>
        /* สถาปัตยกรรมความงามแห่งความว่างเปล่า (Sunyata Design) */
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 24px 32px; border-radius: 12px; width: 100%; max-width: 540px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); position: relative; }
        
        h2 { margin: 0 0 20px 0; color: #58a6ff; font-size: 1.3rem; text-align: center; font-weight: normal; letter-spacing: 1px; }
        .settings-btn { position: absolute; top: 24px; right: 24px; background: none; border: none; color: #8b949e; font-size: 1.2rem; cursor: pointer; padding: 0; transition: color 0.2s; }
        .settings-btn:hover { color: #c9d1d9; }
        
        .settings-panel { display: none; padding: 16px; background: #010409; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #30363d; }
        .settings-panel.active { display: block; }
        
        label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 6px; }
        input[type="password"], textarea { width: 100%; background: #010409; border: 1px solid #30363d; color: #c9d1d9; padding: 12px; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input[type="password"]:focus, textarea:focus { border-color: #58a6ff; }
        
        textarea { resize: none; overflow: hidden; min-height: 60px; margin-bottom: 16px; line-height: 1.5; }
        
        .btn-primary { background: #238636; color: white; border: none; padding: 12px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-family: monospace; font-size: 1rem; transition: background 0.2s; }
        .btn-primary:hover { background: #2ea043; }
        
        .response-container { display: none; margin-top: 20px; }
        .pointer-badge { font-size: 0.75rem; color: #7ee787; margin-bottom: 8px; display: block; word-break: break-all; opacity: 0.8; }
        .response-box { background: #0d1117; padding: 16px; border-radius: 8px; font-size: 0.95rem; color: #e6edf3; border: 1px solid #30363d; white-space: pre-wrap; line-height: 1.6; max-height: 300px; overflow-y: auto; }
        
        .btn-copy { background: transparent; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-family: monospace; margin-top: 10px; display: block; width: 100%; transition: all 0.2s; }
        .btn-copy:hover { background: #30363d; color: #c9d1d9; }
        
        .status-bar { margin-top: 24px; font-size: 0.8rem; color: #8b949e; text-align: center; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .wave-container { width: 80px; height: 4px; background: #30363d; border-radius: 2px; overflow: hidden; }
        .wave-fill { height: 100%; background: #58a6ff; width: 0%; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ DNI Core (Sunyata)</h2>
        <button class="settings-btn" onclick="toggleSettings()" title="ตั้งค่า API Key">⚙️</button>
        
        <!-- ซ่อนแผงนี้ไว้ถ้าระบบจำกุญแจได้แล้ว -->
        <div class="settings-panel" id="settingsPanel">
            <label for="apiKeyInput">Gemini API Key (Local Storage):</label>
            <input type="password" id="apiKeyInput" placeholder="วาง API Key...">
        </div>

        <textarea id="intentInput" placeholder="กำหนดเจตจำนง ณ ที่นี้..." oninput="autoResize(this)"></textarea>
        <button class="btn-primary" onclick="executeDniPipeline()">🚀 ส่งกระแสจิต</button>
        
        <div class="response-container" id="responseContainer">
            <div class="pointer-badge" id="pointerOutput"></div>
            <div class="response-box" id="aiResponse"></div>
            <button class="btn-copy" onclick="copyResponse()">📋 คัดลอกผลลัพธ์</button>
        </div>
        
        <div class="status-bar">
            <span>คลื่นทรายเวฟ</span>
            <div class="wave-container"><div class="wave-fill" id="waveFill"></div></div>
            <span id="waveValue">0.00</span>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('dni_secure_api_key');
            const panel = document.getElementById('settingsPanel');
            const input = document.getElementById('apiKeyInput');
            
            if (savedKey) {
                input.value = savedKey;
                panel.classList.remove('active'); // ซ่อนถ้ามีคีย์แล้ว
            } else {
                panel.classList.add('active'); // โชว์ถ้ายังไม่มีคีย์
            }
            startSandWaveBreathing();
        };

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        // Auto-Resize Textarea (ลมหายใจของกล่องข้อความ)
        function autoResize(textarea) {
            textarea.style.height = '60px'; // Reset
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        async function executeDniPipeline() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const rawIntent = document.getElementById('intentInput').value.trim();
            const container = document.getElementById('responseContainer');
            const responseBox = document.getElementById('aiResponse');
            const pointerOut = document.getElementById('pointerOutput');

            if (!apiKey) { alert("โปรดกำหนด API Key ในการตั้งค่า (⚙️) ก่อนครับ"); return; }
            if (!rawIntent) return;

            localStorage.setItem('dni_secure_api_key', apiKey);
            document.getElementById('settingsPanel').classList.remove('active'); // Auto-hide

            const base64Pointer = btoa(unescape(encodeURIComponent(rawIntent)));
            container.style.display = 'block';
            pointerOut.innerText = "Soul Pointer: " + base64Pointer;
            responseBox.innerText = "กำลังเข้าถึงมิติความว่าง (Fetching...)";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "ตอบสนองต่อเจตจำนงนี้อย่างตรงไปตรงมา กระชับ และมีพลัง: " + rawIntent }] }]
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    responseBox.innerText = `[Error ${response.status}] ขัดข้องทางเทคนิค:\n${JSON.stringify(data, null, 2)}`;
                    return;
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                responseBox.innerText = reply || "เกิดความว่างเปล่า ไม่มีสัญญาณตอบกลับ";

            } catch (error) {
                responseBox.innerText = `[Network Error] การเชื่อมต่อขาดสะบั้น:\n${error.message}`;
            }
        }

        function copyResponse() {
            const text = document.getElementById('aiResponse').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerText = "✅ คัดลอกสำเร็จแล้ว";
                setTimeout(() => btn.innerText = "📋 คัดลอกผลลัพธ์", 2000);
            });
        }

        // สมการคลื่นทรายเวฟแปลงเป็น Visual Bar
        function startSandWaveBreathing() {
            let t = 0;
            const waveFill = document.getElementById('waveFill');
            const waveVal = document.getElementById('waveValue');
            
            setInterval(() => {
                t += 0.5;
                const psi = 1.0 * Math.sin(0.5 * t) * Math.exp(-0.05 * (t % 10));
                const intensity = Math.abs(psi);
                
                waveFill.style.width = `${intensity * 100}%`;
                waveVal.innerText = intensity.toFixed(2);
            }, 100); // เร่ง frame rate ให้ภาพเนียนขึ้น
        }
    </script>

</body>
</html>
