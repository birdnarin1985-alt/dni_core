<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>DNI Core: Cosmic Void & Energetic Voice</title>
    <style>
        /* Base & Reset - Deep Space */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; color: #e0f7fa; }
        
        /* Starfield Canvas Background */
        #starCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* Layout */
        .container { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; box-sizing: border-box; }
        
        /* Chat Card - Void Theme */
        .quantum-card { 
            background: rgba(5, 5, 10, 0.7); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; width: 100%; max-width: 900px; height: 92vh;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.02); 
            position: relative; overflow: hidden;
        }

        /* Header */
        .header { padding: 20px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); z-index: 12; }
        h2 { margin: 0; color: #ffffff; font-size: 1.4rem; letter-spacing: 2px; font-weight: 300; text-transform: uppercase; }
        .settings-btn { background: none; border: none; color: #ffffff; font-size: 1.4rem; cursor: pointer; transition: all 0.3s; opacity: 0.7; }
        .settings-btn:hover { transform: rotate(90deg); opacity: 1; text-shadow: 0 0 10px #ffffff; }

        /* Settings Panel */
        .settings-panel { display: none; padding: 20px; background: rgba(0, 0, 0, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.2); z-index: 12; }
        .settings-panel.active { display: block; animation: fadeIn 0.3s ease-out; }
        .settings-panel input { width: 100%; background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 12px; border-radius: 8px; box-sizing: border-box; font-size: 1.1rem; outline: none; }
        
        /* Chat Area */
        .chat-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; z-index: 12; scroll-behavior: smooth; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }

        /* Messages Container - Clear & Accessible */
        .message { max-width: 85%; padding: 16px 22px; border-radius: 14px; font-size: 1.25rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; position: relative; animation: slideUp 0.3s ease-out; letter-spacing: 0.3px; }
        .msg-user { align-self: flex-end; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-bottom-right-radius: 4px; }
        .msg-ai { align-self: flex-start; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15); border-bottom-left-radius: 4px; }
        .msg-sys { align-self: center; font-size: 1rem; color: #888; background: none; border: none; opacity: 0.8; padding: 5px; }

        /* ⚡ LIVING TEXT (ตัวหนังสือมีชีวิต) ⚡ */
        .living-text {
            background-size: 200% auto;
            color: #ffffff;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline;
        }
        
        .msg-user .living-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #cccccc 25%, #ffffff 50%, #aaaaaa 75%, #ffffff 100%);
            animation: breatheText 5s linear infinite;
        }

        .msg-ai .living-text {
            background-image: linear-gradient(90deg, #ffffff 0%, #e0f7fa 25%, #ffffff 50%, #b2ebf2 75%, #ffffff 100%);
            animation: breatheText 6s linear infinite reverse;
        }

        @keyframes breatheText { to { background-position: 200% center; } }
        
        .cursor { display: inline-block; width: 8px; height: 1.1em; background-color: #ffffff; animation: blink 1s step-end infinite; vertical-align: bottom; margin-left: 4px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Input Area */
        .input-area { padding: 20px 25px; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 15px; z-index: 12; align-items: flex-end; }
        textarea { flex: 1; background: rgba(20, 20, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff; padding: 15px; border-radius: 12px; font-family: inherit; font-size: 1.2rem; outline: none; resize: none; min-height: 54px; max-height: 200px; overflow-y: auto; transition: border-color 0.3s; line-height: 1.5; }
        textarea:focus { border-color: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
        
        .btn-send { background: #ffffff; color: #000000; border: none; padding: 0 25px; height: 54px; border-radius: 12px; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 1.1rem; transition: all 0.3s; }
        .btn-send:hover { background: #cccccc; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
        .btn-send:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        /* Status */
        .status-bar { padding: 12px 25px; font-size: 0.9rem; color: #888; display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 12; font-family: 'Courier New', Courier, monospace; }
        .badge-graph { color: #ffffff; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- เปลี่ยนจากตาข่ายเป็นหมู่ดาว -->
    <canvas id="starCanvas"></canvas>

    <div class="container" id="cardContainer">
        <div class="quantum-card" id="quantumCard">
            
            <div class="header">
                <h2>✨ COSMIC VOID</h2>
                <div>
                    <button class="settings-btn" onclick="toggleVoice()" title="Toggle Voice" id="voiceBtn">🔊</button>
                    <button class="settings-btn" onclick="toggleSettings()" title="Settings" style="margin-left: 15px;">⚙️</button>
                </div>
            </div>
            
            <div class="settings-panel" id="settingsPanel">
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key...">
            </div>

            <div class="chat-container" id="chatBox">
                <div class="message msg-sys">System: Cosmic Void Initialized. Voice: Energetic & Concise.</div>
            </div>
            
            <div class="input-area">
                <textarea id="intentInput" placeholder="ส่งกระแสจิตสู่อวกาศ (Shift+Enter ขึ้นบรรทัดใหม่, Enter ส่ง)..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                <button class="btn-send" id="sendBtn" onclick="executeGraphPipeline()">TRANSMIT</button>
            </div>
            
            <div class="status-bar">
                <div>NODE: <span class="badge-graph" id="nodeIdDisplay">ROOT</span></div>
                <div>STATE: <span style="color:#ffffff;">ZERO LATENCY</span></div>
            </div>
        </div>
    </div>

    <script>
        const graphMap = {};
        let currentTailId = null;
        let isVoiceEnabled = true;

        function generateNodeId() { return Math.random().toString(36).substr(2, 7).toUpperCase(); }

        function addNode(role, text, parentId) {
            const id = generateNodeId();
            graphMap[id] = { id, role, text, parentId };
            currentTailId = id; 
            document.getElementById('nodeIdDisplay').innerText = id;
            return id;
        }

        function getLinearHistory(tailId) {
            const chain = [];
            let curr = tailId;
            while (curr && graphMap[curr]) {
                chain.push({ role: graphMap[curr].role, parts: [{ text: graphMap[curr].text }] });
                curr = graphMap[curr].parentId;
            }
            return chain.reverse();
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('dni_secure_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            else document.getElementById('settingsPanel').classList.add('active');
            
            initStarfield();
        };

        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('active'); }
        function toggleVoice() { 
            isVoiceEnabled = !isVoiceEnabled; 
            document.getElementById('voiceBtn').innerText = isVoiceEnabled ? "🔊" : "🔇"; 
            if(!isVoiceEnabled) window.speechSynthesis.cancel();
        }

        function autoResize(textarea) {
            textarea.style.height = '54px';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                executeGraphPipeline();
            }
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessageDOM(role, text, isTyping = false) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'msg-user' : 'msg-ai'}`;
            
            const textSpan = document.createElement('span');
            textSpan.className = 'living-text';
            
            if (isTyping) {
                msgDiv.id = 'typingMessage';
                textSpan.id = 'typeTarget';
                msgDiv.appendChild(textSpan);
                const cursorSpan = document.createElement('span');
                cursorSpan.className = 'cursor';
                cursorSpan.id = 'activeCursor';
                msgDiv.appendChild(cursorSpan);
                chatBox.appendChild(msgDiv);
                scrollToBottom();
                return msgDiv;
            } else {
                textSpan.innerText = text;
                msgDiv.appendChild(textSpan);
                chatBox.appendChild(msgDiv);
                scrollToBottom();
            }
        }

        let typeInterval;
        function typeWriter(text, targetId, onComplete) {
            clearInterval(typeInterval);
            const el = document.getElementById(targetId);
            let i = 0;
            typeInterval = setInterval(() => {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    scrollToBottom();
                } else {
                    clearInterval(typeInterval);
                    const cursor = document.getElementById('activeCursor');
                    if(cursor) cursor.style.display = 'none'; 
                    if(onComplete) onComplete();
                }
            }, 10); // พิมพ์เร็วขึ้น
        }

        // --- ปรับจูนเสียงให้กระฉับกระเฉง ---
        function speakRobotic(text) {
            if (isVoiceEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/[\*\[\]_#]/g, '');
                const msg = new SpeechSynthesisUtterance(cleanText);
                msg.lang = 'th-TH'; 
                msg.pitch = 1.0; // ระดับเสียงตื่นตัว ปกติ (ไม่ทุ้มต่ำแล้ว)
                msg.rate = 1.3;  // ความเร็วเพิ่มขึ้น พูดกระชับ ไม่ยืดเยื้อ
                window.speechSynthesis.speak(msg);
            }
        }

        async function executeGraphPipeline() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const inputEl = document.getElementById('intentInput');
            const rawIntent = inputEl.value.trim();
            const btn = document.getElementById('sendBtn');
            
            if (!apiKey) { alert("⚠ ระบุ API Key"); document.getElementById('settingsPanel').classList.add('active'); return; }
            if (!rawIntent) return;

            localStorage.setItem('dni_secure_api_key', apiKey);
            inputEl.value = '';
            inputEl.style.height = '54px';
            btn.disabled = true;

            const parentIdAtTimeOfSend = currentTailId;
            addNode('user', rawIntent, parentIdAtTimeOfSend);
            appendMessageDOM('user', rawIntent);

            const conversationHistory = getLinearHistory(currentTailId);
            const aiDOM = appendMessageDOM('model', '', true);

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(JSON.stringify(data.error || data));

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "ความว่างเปล่า...";
                
                addNode('model', reply, currentTailId);
                
                typeWriter(reply, 'typeTarget', () => {
                    aiDOM.removeAttribute('id');
                });
                speakRobotic(reply);

            } catch (error) {
                document.getElementById('typeTarget').innerText = `[SYSTEM ERR]: ${error.message}`;
                const cursor = document.getElementById('activeCursor');
                if(cursor) cursor.style.display = 'none';
            } finally {
                btn.disabled = false;
                inputEl.focus();
            }
        }

        // --- ระบบอวกาศ (Starfield) ---
        function initStarfield() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, stars;
            
            function resize() { 
                w = canvas.width = window.innerWidth; 
                h = canvas.height = window.innerHeight; 
            }
            window.addEventListener('resize', resize); 
            resize();
            
            stars = Array.from({length: 200}, () => ({
                x: Math.random() * w, 
                y: Math.random() * h,
                z: Math.random() * 2 + 0.1 // ความลึก/ความเร็ว (Parallax)
            }));
            
            function draw() {
                ctx.clearRect(0, 0, w, h); 
                ctx.fillStyle = '#ffffff';
                
                for (let i = 0; i < stars.length; i++) {
                    let s = stars[i];
                    s.y += s.z * 0.5; // ดาวเลื่อนลงช้าๆ
                    if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
                    
                    ctx.globalAlpha = s.z / 2; // ดาวไกลจะจาง ดาวใกล้จะสว่าง
                    ctx.beginPath(); 
                    ctx.arc(s.x, s.y, s.z * 0.8, 0, Math.PI * 2); 
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
